
name: Release

# Builds native installers for Windows, macOS and Linux
# whenever a version tag (e.g. v1.0.0) is pushed.
#
# Each installer includes its own Java runtime created with jlink.
# Users do not need to install Java separately.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installer for ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: gradedesk-windows
            pattern: target/installer/*.msi

          - os: macos-latest
            label: macOS
            artifact: gradedesk-macos
            pattern: target/installer/*.dmg

          - os: ubuntu-latest
            label: Linux
            artifact: gradedesk-linux
            pattern: target/installer/*.deb

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install WiX Toolset
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Install tools for Debian packaging
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot binutils

      - name: Run tests
        run: ./mvnw --batch-mode verify
        shell: bash

      - name: Build installer
        run: ./mvnw --batch-mode -Pinstaller -DskipTests package
        shell: bash

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installer
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*
          draft: false
          generate_release_notes: true
          body: |
            Native installers for Windows, macOS and Linux.

            Each installer includes its own Java runtime.
            No separate Java installation is required.

            **Note:** The installers are currently unsigned.
            Windows may display a SmartScreen warning, while macOS
            may display a Gatekeeper warning.

            Instructions for handling these warnings are available
            in the README.
