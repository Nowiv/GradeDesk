
# Builds native installers for Windows, macOS and Linux
# whenever a version tag (e.g. v1.2.3) is pushed.
#
# Each installer includes its own Java runtime created with jlink.
# Runner images are pinned to avoid unexpected OS changes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installer for ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows
            artifact: gradedesk-windows
            pattern: target/installer/*.msi

          - os: macos-15
            label: macOS
            artifact: gradedesk-macos
            pattern: target/installer/*.dmg

          - os: ubuntu-24.04
            label: Linux
            artifact: gradedesk-linux
            pattern: target/installer/*.deb

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Derive Maven version from Git tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building GradeDesk version $VERSION"

      - name: Provide WiX 3 for jpackage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # JDK 21 jpackage requires the WiX 3.x tools candle.exe and light.exe.
          # Prefer the known WiX 3 installation path; install a pinned fallback
          # only if the tools are not already available.
          $candidate = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'

          if (-not (Test-Path (Join-Path $candidate 'candle.exe')) -or
              -not (Test-Path (Join-Path $candidate 'light.exe'))) {
            choco install wixtoolset --version=3.14.1.20250415 --no-progress --yes
          }

          $wixRoot = 'C:\Program Files (x86)\WiX Toolset v3.14'
          $bin = Join-Path $wixRoot 'bin'
          $candle = Join-Path $bin 'candle.exe'
          $light = Join-Path $bin 'light.exe'

          if (-not (Test-Path $candle) -or -not (Test-Path $light)) {
            throw "WiX 3.14 was not found at the expected location: $bin"
          }

          Write-Host "Using WiX 3 from $bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run tests
        run: ./mvnw --batch-mode -Drevision=${{ steps.version.outputs.value }} verify
        shell: bash

      - name: Build installer
        run: ./mvnw --batch-mode -Drevision=${{ steps.version.outputs.value }} -Pinstaller -DskipTests package
        shell: bash

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: installer
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: installer
        run: |
          # Plain file names without a "./" prefix, so that anyone who puts
          # SHA256SUMS.txt next to the installers can run
          # "sha256sum -c SHA256SUMS.txt" without editing the file first.
          find . -maxdepth 1 -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \) \
            -printf '%P\0' \
            | sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt

          # Read the installers back and fail before publishing if a checksum
          # disagrees, for example after a truncated artifact download.
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            installer/*.msi
            installer/*.dmg
            installer/*.deb
            installer/SHA256SUMS.txt
          draft: false
          generate_release_notes: true
          body: |
            Native installers for Windows, macOS and Linux.

            Each installer includes its own Java runtime.
            No separate Java installation is required.

            SHA-256 checksums are provided in SHA256SUMS.txt.

            **Note:** The installers are currently unsigned.
            Windows may display a SmartScreen warning, while macOS
            may display a Gatekeeper warning.

            Instructions for handling these warnings are available
            in the README.
