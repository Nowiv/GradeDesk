
name: Release

# Builds native installers for Windows, macOS and Linux
# whenever a version tag (e.g. v1.0.0) is pushed.
#
# Each installer includes its own Java runtime created with jlink.
# Users do not need to install Java separately.
#
# Runner images are pinned on purpose: the "-latest" labels move to new
# operating system versions without notice (ubuntu-latest is currently
# migrating to Ubuntu 26.04), which would change the build environment
# of a release build underneath us.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installer for ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows
            artifact: gradedesk-windows
            pattern: target/installer/*.msi

          - os: macos-15
            label: macOS
            artifact: gradedesk-macos
            pattern: target/installer/*.dmg

          - os: ubuntu-24.04
            label: Linux
            artifact: gradedesk-linux
            pattern: target/installer/*.deb

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Provide WiX 3 for jpackage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # jpackage on JDK 21 builds MSI packages with candle.exe and
          # light.exe, which only exist in WiX 3.x. The windows-2025 image
          # ships WiX 3.14, so install it only if it is ever missing, and
          # always put the resolved directory on PATH for the later steps.
          $bin = (Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3*\bin\candle.exe' -ErrorAction SilentlyContinue |
                  Select-Object -First 1).DirectoryName
          if (-not $bin) {
            choco install wixtoolset --version 3.14.1.20250415 --no-progress -y
            $bin = (Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3*\bin\candle.exe' |
                    Select-Object -First 1).DirectoryName
          }
          Write-Host "Using WiX from $bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run tests
        run: ./mvnw --batch-mode verify
        shell: bash

      - name: Build installer
        run: ./mvnw --batch-mode -Pinstaller -DskipTests package
        shell: bash

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: installer
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: installer/*
          draft: false
          generate_release_notes: true
          body: |
            Native installers for Windows, macOS and Linux.

            Each installer includes its own Java runtime.
            No separate Java installation is required.

            **Note:** The installers are currently unsigned.
            Windows may display a SmartScreen warning, while macOS
            may display a Gatekeeper warning.

            Instructions for handling these warnings are available
            in the README.
