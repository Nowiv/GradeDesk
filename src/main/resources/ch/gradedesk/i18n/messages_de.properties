settings.privacy.title=Datenschutz
settings.privacy.meta=Diese Anwendung ist rein lokal.
settings.privacy.lead=Noten sind heikle Daten. GradeDesk ist so gebaut, dass sie das Gerät gar nicht erst verlassen müssen.
settings.privacy.1=Es gibt keinen Cloud-Abgleich, kein Konto und keine Telemetrie. Bei aktivierter Update-Suche kontaktiert GradeDesk GitHub; Notendaten werden dabei nie übertragen.
settings.privacy.2=Die Noten liegen ausschliesslich im Profil des angemeldeten Betriebssystem-Benutzers. Andere Benutzer desselben Geräts sehen ihre eigenen, getrennten Daten.
settings.privacy.3=Es gibt keine Export- oder Teilen-Funktion. Was das Gerät verlässt, verlässt es nur, wenn jemand die Datei selbst kopiert.
settings.privacy.4=Der Installer enthält keine Notendaten. Nach einer Neuinstallation startet die Anwendung leer, bestehende Daten im Benutzerprofil bleiben erhalten.
