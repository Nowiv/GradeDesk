# GradeDesk - English (default bundle)
#
# Keys are grouped by surface. Plural forms use ChoiceFormat so that
# "no grades", "1 grade" and "7 grades" come from a single key.
#
# Note on encoding: this file is UTF-8. Java reads .properties as UTF-8
# since Java 9, so no \u escapes are needed.

