settings.privacy.title=Privacy
settings.privacy.meta=This application is entirely local.
settings.privacy.lead=Grades are sensitive data. GradeDesk is built so that they never have to leave your device in the first place.
settings.privacy.1=The app has no cloud sync, account or telemetry. If enabled, the update checker contacts GitHub to look for releases; grade data is never sent.
settings.privacy.2=Grades are stored only in the profile of the signed-in operating system user. Other users of the same device see their own, separate data.
settings.privacy.3=There is no export or sharing feature. Nothing leaves the device unless you copy the file yourself.
settings.privacy.4=The installer contains no grade data. After a reinstall the application starts empty; existing data in your user profile is kept.
