# GradeDesk - English
#
# This file is intentionally almost empty, and it must not be deleted.
#
# ResourceBundle resolves a missing bundle by falling back to the *default
# locale of the machine* before it falls back to the base bundle. On a German
# Windows, asking for English would therefore have loaded messages_de.properties
# and the application would have stayed German even though English was selected.
#
# With this file present, the lookup for English stops here. Every key is then
# inherited from the parent bundle messages.properties, which holds the English
# wording. So English lives in exactly one place and nothing is duplicated.
#
# Should a wording ever need to differ between "generic English" and this
# bundle, it can be overridden here key by key.
